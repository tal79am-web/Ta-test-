version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: opportunityscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoutpassword}
      POSTGRES_DB: ${POSTGRES_DB:-opportunityscout}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scout} -d ${POSTGRES_DB:-opportunityscout}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opportunityscout-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: opportunityscout-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD:-scoutpassword}@postgres:5432/${POSTGRES_DB:-opportunityscout}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      API_KEY: ${API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ALERT_EMAIL: ${ALERT_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/backend/src:ro
    profiles:
      - full

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: opportunityscout-scheduler
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD:-scoutpassword}@postgres:5432/${POSTGRES_DB:-opportunityscout}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ALERT_EMAIL: ${ALERT_EMAIL}
      CRAWL_SCHEDULE: ${CRAWL_SCHEDULE:-0 5 * * *}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-OpportunityScout/1.0}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      STACKOVERFLOW_KEY: ${STACKOVERFLOW_KEY}
      PRODUCTHUNT_TOKEN: ${PRODUCTHUNT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: opportunityscout-network
